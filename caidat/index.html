<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cài ứng dụng Bản đồ số hộ nghèo – MTTQ xã Trường Khánh</title>
<meta name="description" content="Quét mã để cài ứng dụng Bản đồ số hộ nghèo, hộ cận nghèo của Ủy ban MTTQ Việt Nam xã Trường Khánh lên điện thoại.">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hộ nghèo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--navy:#14213d;--navy2:#1f3260;--red:#a3191c;--gold:#d4a33a;--ink:#1b2230;--muted:#5d6878;--line:#e2e6eb;--bg:#eef1f4;--ok:#2e7d32}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
  .top{background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 22px;border-bottom:5px solid var(--red)}
  .brand{display:flex;gap:14px;align-items:center;max-width:560px;margin:0 auto;padding-right:var(--pr,0)}
  .brand img{width:58px;height:58px;border-radius:14px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .brand h1{font-size:19px;line-height:1.25;margin:0 0 3px;font-weight:700}
  .brand p{margin:0;font-size:13.5px;opacity:.85}
  main{max-width:560px;margin:0 auto;padding:16px 14px 28px}
  .card{background:#fff;border-radius:16px;padding:18px 16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(20,33,61,.08);border:1px solid var(--line)}
  .card h2{font-size:18px;margin:0 0 10px;color:var(--navy)}
  .lead{font-size:16px;margin:0 0 14px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:14px 16px;border:0;border-radius:14px;font:inherit;font-size:18px;font-weight:700;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btn-main{background:var(--red);color:#fff;box-shadow:0 4px 14px rgba(163,25,28,.35)}
  .btn-main.pulse{animation:pulse 1.6s ease-in-out infinite}
  .btn-navy{background:var(--navy);color:#fff}
  .btn-line{background:#fff;color:var(--navy);border:2px solid var(--navy);font-size:16px;min-height:50px}
  .btn+.btn{margin-top:10px}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
  ol.steps li{counter-increment:s;position:relative;padding:4px 0 12px 46px;min-height:40px}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
  .k{display:inline-block;background:var(--soft,#f6f7f9);border:1px solid var(--line);border-radius:7px;padding:0 7px;font-weight:700;color:var(--navy);white-space:nowrap}
  .muted{color:var(--muted);font-size:14px}
  .ok{border-color:#b9dcbb;background:#f3faf3}
  .ok h2{color:var(--ok)}
  .url{display:flex;gap:8px;margin-top:8px}
  .url input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#f6f7f9;color:var(--ink)}
  .url button{flex:none;font:inherit;font-size:15px;font-weight:700;padding:0 14px;border-radius:10px;border:0;background:var(--navy);color:#fff}
  .hint{position:fixed;z-index:9;pointer-events:none;background:#fff;color:var(--red);font-weight:800;font-size:14px;line-height:1.2;padding:6px 10px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.35);border:2px solid var(--red)}
  .hint .ar{font-size:26px;line-height:1;display:block}
  .hint.tr{top:calc(4px + env(safe-area-inset-top));right:6px;text-align:center;max-width:112px;animation:bobU 1s ease-in-out infinite}
  .hint.bc{bottom:calc(6px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);text-align:center;animation:bobD 1s ease-in-out infinite}
  @keyframes bobU{0%,100%{translate:0 0}50%{translate:0 -8px}}
  @keyframes bobD{0%,100%{translate:0 0}50%{translate:0 8px}}
  .spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .qr{display:block;width:100%;max-width:280px;margin:6px auto 10px;image-rendering:pixelated}
  footer{max-width:560px;margin:0 auto;padding:0 18px 30px;text-align:center}
  footer a{color:var(--navy);font-weight:600}
  .hide{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="/icon-192.png" alt="">
    <div>
      <h1>Bản đồ số hộ nghèo, hộ cận nghèo</h1>
      <p>Ủy ban MTTQ Việt Nam xã Trường Khánh</p>
    </div>
  </div>
</header>
<main id="v" aria-live="polite"></main>
<div id="hint"></div>
<footer>
  <p class="muted">Sau khi cài: mở biểu tượng <b>Hộ nghèo</b> trên màn hình chính, đăng nhập bằng <b>số điện thoại</b> và <b>mật khẩu</b> quản trị viên đã cấp.</p>
  <p class="muted"><a href="/">Mở bản web (không cần cài)</a></p>
</footer>
<script>
(function () {
  'use strict';
  var HOST = 'mttq-truongkhanh.github.io';
  var APP = 'https://' + HOST + '/';
  var PAGE = APP + 'caidat/';
  var ua = navigator.userAgent || '';
  var q = new URLSearchParams(location.search);
  var force = q.get('xem');                          /* ?xem=android|ios|zalo|zaloios|pc : xem thử từng màn hình */
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /android/i.test(ua);
  var inApp = /Zalo|FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|Line\/|musical_ly|Bytedance|TikTok|GSA\/|MicroMessenger|Snapchat|Twitter|; wv\)/i.test(ua);
  var appName = /Zalo/i.test(ua) ? 'Zalo' : /FBAN|FBAV|FB_IAB|FBIOS|Messenger/i.test(ua) ? 'Facebook' : /GSA\//.test(ua) ? 'ứng dụng Google' : 'ứng dụng này';
  var iosSafari = isIOS && !inApp && /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|YaBrowser|CocCoc|coc_coc/i.test(ua);
  var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  var V = document.getElementById('v'), H = document.getElementById('hint');
  var bip = null, mode = '';

  if (standalone && !force) { location.replace('/'); return; }

  /* Ứng dụng web cài được: cần tệp khai báo + service worker của trang chính */
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});

  var intentChrome = 'intent://' + HOST + '/caidat/?tu=app#Intent;scheme=https;package=com.android.chrome;end';
  var intentAny = 'intent://' + HOST + '/caidat/?tu=app#Intent;scheme=https;end';
  var safariLink = 'x-safari-https://' + HOST + '/caidat/';

  function hint(cls, text) { document.documentElement.style.setProperty('--pr', cls === 'tr' ? '108px' : '0'); H.innerHTML = cls ? '<div class="hint ' + cls + '">' + (cls === 'tr' ? '<span class="ar">⬆</span>' + text : text + '<span class="ar">⬇</span>') + '</div>' : ''; }
  function urlBox() {
    return '<div class="url"><input id="u" value="' + PAGE + '" readonly onfocus="this.select()"><button type="button" id="cp">Sao chép</button></div>';
  }
  function bindCopy() {
    var b = document.getElementById('cp'); if (!b) return;
    b.onclick = function () {
      var i = document.getElementById('u'); i.select();
      var done = function () { b.textContent = 'Đã chép'; };
      if (navigator.clipboard) navigator.clipboard.writeText(i.value).then(done, function () { try { document.execCommand('copy'); done(); } catch (e) {} });
      else { try { document.execCommand('copy'); done(); } catch (e) {} }
    };
  }
  function show(html, h) { V.innerHTML = html; hint(h && h[0], h && h[1]); bindCopy(); }

  /* ---------- Android, đang ở trong Zalo / Facebook… ---------- */
  function androidInApp() {
    mode = 'android-inapp';
    show(
      '<div class="card"><h2>Mở bằng Chrome để cài</h2>' +
      '<p class="lead">Trình duyệt bên trong <b>' + appName + '</b> không cài được ứng dụng. Bấm nút dưới, điện thoại sẽ chuyển sang <b>Chrome</b> và hiện nút cài đặt.</p>' +
      '<a class="btn btn-main pulse" href="' + intentChrome + '">🚀 MỞ BẰNG CHROME ĐỂ CÀI</a>' +
      '<a class="btn btn-line" href="' + intentAny + '">Mở bằng trình duyệt khác</a></div>' +
      '<div class="card"><h2>Bấm nút trên mà không được?</h2><ol class="steps">' +
      '<li>Bấm dấu <span class="k">⋮</span> hoặc <span class="k">⋯</span> ở <b>góc trên bên phải</b> màn hình.</li>' +
      '<li>Chọn <b>Mở bằng trình duyệt</b> (hoặc <b>Mở trong Chrome</b>).</li></ol>' +
      '<p class="muted" style="margin:4px 0 0">Hoặc chép đường link này, dán vào Chrome:</p>' + urlBox() + '</div>',
      ['tr', 'Hoặc bấm ⋮ / ⋯']);
    /* Thử tự chuyển sang Chrome một lần */
    try {
      if (!force && !sessionStorage.getItem('daThuChrome')) {
        sessionStorage.setItem('daThuChrome', '1');
        setTimeout(function () { location.href = intentChrome; }, 700);
      }
    } catch (e) {}
  }

  /* ---------- iPhone, đang ở trong Zalo / Facebook / Chrome… ---------- */
  function iosOther() {
    mode = 'ios-other';
    var crios = /CriOS/i.test(ua) && !inApp;
    show(
      '<div class="card"><h2>Mở bằng Safari để cài</h2>' +
      '<p class="lead">iPhone chỉ cài được ứng dụng web từ <b>Safari</b>' + (crios ? '' : ' (trình duyệt trong <b>' + appName + '</b> không cài được)') + '.</p>' +
      '<a class="btn btn-main pulse" href="' + safariLink + '">🧭 MỞ BẰNG SAFARI</a></div>' +
      '<div class="card"><h2>Bấm nút trên mà không được?</h2><ol class="steps">' +
      (crios
        ? '<li>Bấm nút <b>Chia sẻ</b> <span class="k">⬆</span> trên thanh địa chỉ.</li><li>Chọn <b>Thêm vào MH chính</b> → <b>Thêm</b>.</li>'
        : '<li>Bấm dấu <span class="k">⋯</span> ở <b>góc trên bên phải</b>.</li><li>Chọn <b>Mở bằng Safari</b> (hoặc <b>Mở bằng trình duyệt</b>).</li>') +
      '</ol><p class="muted" style="margin:4px 0 0">Hoặc chép đường link này, mở Safari và dán vào:</p>' + urlBox() + '</div>',
      crios ? null : ['tr', 'Hoặc bấm ⋯']);
  }

  /* ---------- iPhone, Safari ---------- */
  function iosSafariView() {
    mode = 'ios-safari';
    /* Để biểu tượng trên màn hình chính mở thẳng vào ứng dụng */
    if (!force) { try { history.replaceState(null, '', '/'); } catch (e) {} }
    var ipad = /ipad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    show(
      '<div class="card"><h2>Cài lên iPhone: 3 bước</h2><ol class="steps">' +
      '<li>Bấm nút <b>Chia sẻ</b> <span class="k">⬆</span> ' + (ipad ? 'ở <b>góc trên bên phải</b>' : 'ở <b>thanh dưới cùng</b>') + '.<br><span class="muted">iOS mới: bấm <span class="k">⋯</span> rồi chọn <b>Chia sẻ</b>.</span></li>' +
      '<li>Kéo xuống, chọn <b>Thêm vào MH chính</b>.</li>' +
      '<li>Bấm <b>Thêm</b> ở góc trên bên phải. Xong!</li></ol></div>' +
      '<div class="card"><p class="muted" style="margin:0">Biểu tượng <b>Hộ nghèo</b> sẽ xuất hiện trên màn hình chính. Bấm vào để mở như một ứng dụng.</p></div>',
      ipad ? ['tr', 'Nút Chia sẻ'] : ['bc', 'Bấm nút Chia sẻ ở đây']);
  }

  /* ---------- Android, Chrome / Samsung Internet / Cốc Cốc… ---------- */
  function androidBrowser() {
    mode = 'android';
    var chromeLike = /Chrome\//.test(ua) && !/SamsungBrowser|MiuiBrowser|XiaoMi|HeyTapBrowser|OPR\/|Firefox|UCBrowser|EdgA/i.test(ua);
    if (bip) {
      show(
        '<div class="card"><h2>Sẵn sàng cài đặt</h2><p class="lead">Bấm nút dưới, rồi bấm <b>Cài đặt</b> trong hộp thoại hiện ra.</p>' +
        '<button type="button" class="btn btn-main pulse" id="go">📲 CÀI ĐẶT NGAY</button></div>' + manualCard(chromeLike));
      document.getElementById('go').onclick = doInstall;
    } else {
      show(
        '<div class="card"><h2>Cài lên điện thoại: 2 bước</h2><ol class="steps">' +
        '<li>Bấm dấu <span class="k">⋮</span> ở <b>góc trên bên phải</b> màn hình.</li>' +
        '<li>Chọn <b>Cài đặt ứng dụng</b> (hoặc <b>Thêm vào màn hình chính</b>), rồi bấm <b>Cài đặt</b>.</li></ol>' +
        '<p class="muted" style="margin:2px 0 0">Nếu nút đỏ <b>CÀI ĐẶT NGAY</b> hiện ra ở đây, chỉ cần bấm nút đó.</p></div>' +
        (chromeLike ? '' : '<div class="card"><h2>Không thấy mục cài đặt?</h2><p class="lead">Trình duyệt này có thể không hỗ trợ. Mở bằng Chrome:</p><a class="btn btn-navy" href="' + intentChrome + '">Mở bằng Chrome</a></div>') +
        '<div class="card"><p class="muted" style="margin:0">Đã cài rồi? Tìm biểu tượng <b>Hộ nghèo</b> trên màn hình chính và bấm vào.</p></div>',
        ['tr', 'Bấm ⋮ ở đây']);
    }
  }
  function manualCard(chromeLike) {
    return '<div class="card"><h2>Không thấy hộp thoại?</h2><ol class="steps">' +
      '<li>Bấm dấu <span class="k">⋮</span> ở góc trên bên phải.</li>' +
      '<li>Chọn <b>Cài đặt ứng dụng</b> → <b>Cài đặt</b>.</li></ol></div>';
  }
  function doInstall() {
    var ev = bip; if (!ev) { androidBrowser(); return; }
    bip = null;
    var b = document.getElementById('go'); if (b) { b.classList.remove('pulse'); b.innerHTML = '<span class="spin"></span> Đang mở hộp thoại cài…'; }
    ev.prompt();
    ev.userChoice.then(function (c) {
      if (c && c.outcome === 'accepted') installing();
      else androidBrowser();
    }, androidBrowser);
  }
  function installing() {
    show('<div class="card"><h2>Đang cài đặt…</h2><p class="lead"><span class="spin" style="border-color:rgba(20,33,61,.2);border-top-color:#14213d;vertical-align:-4px"></span>&nbsp; Chờ vài giây để điện thoại thêm biểu tượng <b>Hộ nghèo</b>.</p></div>');
    setTimeout(done, 9000);
  }
  function done() {
    if (mode === 'done') return; mode = 'done';
    show('<div class="card ok"><h2>✅ Đã cài xong!</h2><p class="lead">Biểu tượng <b>Hộ nghèo</b> đã có trên màn hình chính. Từ nay chỉ cần bấm vào biểu tượng đó.</p>' +
      '<a class="btn btn-main" href="/">Mở ứng dụng ngay</a></div>');
  }

  /* ---------- Máy tính ---------- */
  function desktop() {
    mode = 'pc';
    show('<div class="card" style="text-align:center"><h2>Quét mã bằng điện thoại để cài</h2>' +
      '<img class="qr" src="qr.png" alt="Mã QR cài ứng dụng">' +
      '<p class="muted">Mở camera (hoặc Zalo → Quét mã QR), hướng vào mã trên, bấm vào đường link hiện ra.</p>' +
      '<a class="btn btn-navy" href="/">Dùng trên máy tính</a></div>');
  }

  addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); bip = e;
    if (mode === 'android' || mode === '') androidBrowser();
  });
  addEventListener('appinstalled', done);

  var m = force || (isAndroid ? (inApp ? 'zalo' : 'android') : isIOS ? (iosSafari ? 'ios' : 'zaloios') : 'pc');
  ({ zalo: androidInApp, android: androidBrowser, ios: iosSafariView, zaloios: iosOther, pc: desktop, xong: done }[m] || desktop)();
})();
</script>
</body>
</html>
